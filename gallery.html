<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="See finished grooms from Rock Solid Pet Grooming.">
  <title>Gallery | Rock Solid Pet Grooming</title>
  <link rel="stylesheet" href="styles.css?v=20261004">
  <script src="gallery.js" defer></script>
</head>
<body>
  <header class="top-banner pricing-banner">
    <h1>Gallery</h1>
    <div class="nav-buttons">
      <a class="nav-button" href="index.html">About Us</a>
      <a class="nav-button secondary is-active" href="gallery.html" aria-current="page">Gallery</a>
      <a class="nav-button" href="contact.html">Contact</a>
    </div>
  </header>
  <main class="section gallery-page">
    <section aria-label="Finished grooms">
      <p class="section-text">A look at our finished grooms.</p>
      <!-- DEVELOPMENT ONLY: remove this notice when supplied photos are ready. -->
      <p class="development-notice">Development preview: gallery photos are awaiting the owner's photo batch.</p>
      <div class="gallery-grid">
        <!-- Add photo links here in display order. See MAINTENANCE.md. -->
      </div>
    </section>
  </main>
  <section class="footer-strip footer-simple">
    <p>Fully insured for pet grooming services.</p>
  </section>
  <dialog class="photo-viewer" aria-label="Gallery photo viewer">
    <div class="viewer-toolbar">
      <p class="viewer-count" aria-live="polite" aria-atomic="true"></p>
      <button type="button" class="viewer-close" autofocus>Close <span aria-hidden="true">&times;</span></button>
    </div>
    <div class="viewer-image-area"><img class="viewer-image" alt=""></div>
    <p class="viewer-error" role="status" hidden>We couldn't load this photo. Please close the viewer and try again.</p>
    <div class="viewer-navigation">
      <button type="button" class="viewer-prev" aria-label="Previous photo">&larr; Previous</button>
      <button type="button" class="viewer-next" aria-label="Next photo">Next &rarr;</button>
    </div>
  </dialog>
</body>
</html>
