# Rock Solid Pet Grooming gallery editor (staging).
# Do NOT switch branch to main until the owner approves production publishing.
# GitHub authentication requires an OAuth provider/proxy configured separately.
backend:
  name: github
  repo: Trick56/RockSolidPetGrooming.io
  branch: development

media_folder: "images/gallery"
public_folder: "/images/gallery"

collections:
  - name: "website"
    label: "Website Photos"
    files:
      - name: "gallery"
        label: "Gallery Photos"
        file: "gallery-data.json"
        format: "json"
        fields:
          - label: "Photos"
            name: "photos"
            widget: "list"
            summary: "{{fields.alt}}"
            fields:
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Description", name: "alt", widget: "string", hint: "Brief description of the groomed pet for accessibility." }
